<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEAL TRAIN for ANNE KATZ — SIGN UP FORM</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body><main>
<header><h1>MEAL TRAIN for ANNE KATZ</h1><h2>SIGN UP FORM</h2></header>
<form id="signup">
<label class="line-field" for="full-name"><span>My Name: <b>*</b></span><input id="full-name" name="full_name" autocomplete="name" maxlength="120" required></label>
<fieldset><legend>Yes, I would like to: <b>*</b></legend>
<label class="choice"><input type="radio" name="meal_type" value="homecooked" required><span>Prepare a homecooked meal for Anne and deliver it to her.</span></label>
<label class="choice"><input type="radio" name="meal_type" value="restaurant" required><span>Order a meal for Anne from a restaurant and schedule its delivery by Grubhub, Uber Eats, etc.</span></label>
</fieldset>
<fieldset><legend>I would like to sign up for the following date: <b>*</b></legend>
<div class="date-row"><label class="choice"><input type="checkbox" name="date" value="2026-10-10"><span>Sat. Oct. 10th</span></label><span aria-hidden="true"> - </span><span class="name-line" data-date="2026-10-10" aria-label="Names for Sat. Oct. 10th"></span></div>
<div class="date-row"><label class="choice"><input type="checkbox" name="date" value="2026-10-14"><span>Wed. Oct. 14th</span></label><span aria-hidden="true"> - </span><span class="name-line" data-date="2026-10-14" aria-label="Names for Wed. Oct. 14th"></span></div>
<div class="date-row"><label class="choice"><input type="checkbox" name="date" value="2026-10-18"><span>Sat. Oct. 18th</span></label><span aria-hidden="true"> - </span><span class="name-line" data-date="2026-10-18" aria-label="Names for Sat. Oct. 18th"></span></div>
<div class="date-row"><label class="choice"><input type="checkbox" name="date" value="2026-10-22"><span>Wed. Oct. 22nd</span></label><span aria-hidden="true"> - </span><span class="name-line" data-date="2026-10-22" aria-label="Names for Wed. Oct. 22nd"></span></div>
<p id="load-status" role="status">Loading saved names…</p>
</fieldset>
<label class="line-field" for="email"><span>My Email Address: <b>*</b></span><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required></label>
<label class="line-field" for="phone"><span>My Phone Number (please incl. area code) <b>*</b></span><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40" required></label>
<label class="comment-label" for="comment">Comment:</label><textarea id="comment" name="comment" rows="5" maxlength="5000"></textarea>
<div class="actions"><button type="submit">Submit</button><button type="reset" class="secondary">Cancel</button></div>
<p class="required-note">* Required</p><p id="status" role="status" aria-live="polite"></p>
</form></main></body></html>
